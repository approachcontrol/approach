# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: approach

builds:
  - id: approach
    main: ./cmd/approach
    binary: approach
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w
        -X github.com/approachcontrol/approach/internal/version.version={{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Tag }}{{ end }}
        -X github.com/approachcontrol/approach/internal/version.commit={{ .ShortCommit }}
        -X github.com/approachcontrol/approach/internal/version.date={{ .Date }}

archives:
  - id: approach
    ids:
      - approach
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

homebrew_casks:
  - name: approach
    ids:
      - approach
    binaries:
      - approach
    directory: Casks
    homepage: "https://github.com/approachcontrol/approach"
    description: "Terminal UI for managing git worktrees across repositories"
    repository:
      owner: approachcontrol
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
