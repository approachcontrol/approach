name: Claude Code Review

# On demand only. This review used to run automatically on every opened,
# reopened, or ready-for-review pull request; that trigger is gone. Start a
# review by hand from the Actions tab or with
# `gh workflow run claude-code-review.yml -f pr_number=<N>`, which runs the copy
# of this file on the ref it is dispatched with — the default branch unless
# `--ref` names another. GitHub only offers the dispatch (and this input) once
# the file is on the default branch. Drafts are reviewable now too: the old
# draft skip belonged to the automatic trigger.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

concurrency:
  group: claude-review-${{ inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # required: the review posts PR and inline comments
      issues: read
      actions: read # required: lets the review read CI results on the PR
      id-token: write # required: used to fetch the GitHub OIDC token

    steps:
      # Keeps the protection the removed pull_request trigger's `if:` guard
      # gave: this job holds CLAUDE_CODE_OAUTH_TOKEN and `pull-requests: write`,
      # so it must not be pointed at a pull request from a fork.
      - name: Validate pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "pr_number must be a pull request number, got: $PR_NUMBER" >&2
            exit 1
          fi
          head_repo=$(gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json headRepository,headRepositoryOwner \
            --jq '"\(.headRepositoryOwner.login)/\(.headRepository.name)"')
          if [[ "$head_repo" != "$REPO" ]]; then
            echo "PR #$PR_NUMBER is from $head_repo, not $REPO; refusing to review a fork." >&2
            exit 1
          fi

      - name: Checkout pull request
        uses: actions/checkout@v6
        with:
          # The pull request's merge ref, which is what actions/checkout landed
          # on under the removed pull_request trigger. Without it the review
          # would read the dispatch ref and quote the base version of every
          # file it opens. The step above has already refused fork pull
          # requests, so this is still first-party code.
          ref: refs/pull/${{ inputs.pr_number }}/merge
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ inputs.pr_number }}"
          additional_permissions: |
            actions: read
          # The code-review plugin drives GitHub through the gh CLI; allowlisting
          # only the MCP tool leaves it unable to read the PR or post a summary.
          claude_args: >-
            --allowedTools
            "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
